# DSH-Zink 优化配置包 v1.2.0 — 性能优先 / 视觉不降级
# 由 dshconfig 部署：仅在目标文件缺失、或仍为原始 mod 默认（未手改）时写入；手改后不再覆盖。详见 CONFIG_NOTES.md
version = 1
enableSodiumMenu = true
cloudCulling = true
signTextCulling = true
rainCulling = true
dontCull = []
useBlockStateCulling = true
useCustomItemFrameRenderer = true
itemFrameMapCulling = true
useItemFrameLOD = true
itemFrameLODRange = 16
useItemFrame3FaceCulling = true
itemFrame3FaceCullingRange = 2.0
paintingCulling = true
leavesCullingMode = "DEFAULT"
leavesCullingAmount = 2
includeMangroveRoots = false
endGatewayCulling = false
beaconBeamCulling = true
useOnModdedBlocksByDefault = true

[modCompatibility]
offroad = true
synaxis = true
create_connected = true
createdieselgenerators = true
createbigcannons = true
sophisticatedstorage = true
sable_schematic_api = true
ldlib2 = true
create = true
aeronautics = true
tacz = true
simulated = true
chunkloaders = true
createsifter = true
sentrymechanicalarm = true
create_radar = true
copycats = true
minecraft = true
