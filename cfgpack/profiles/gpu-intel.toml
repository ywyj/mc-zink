# Intel 档（Arc 独显 / Iris Xe 核显）— config/super_resolution/config.toml 最小覆盖片段
# 用法见 profiles/README.md；未列出的键保持原值。
# 结论：Arc/Xe 都支持 GL 4.6（Mesa 底层），FSR1 可用；XeSS 依赖 libxess + Vulkan 互操作，zink 下未验证 → 不要默认；
#       iGPU 显存/带宽紧张时把 upscale_ratio 提到 2.0（内部 1280x720@1440p），Arc 独显可保持 1.5。
upscale_algo = "fsr1"
upscale_ratio = 1.5
sharpness = 1.0
internal_texture_format = "AUTO"
enable_upscale = true

[presentation]
backend = "VULKAN"

[frame_generation]
mode = "OFF"
provider = "superresolution:auto"
backend = "wisteria:streamline"

[low_latency]
mode = "OFF"

[low_latency.nv_reflex]
mode = "OFF"
