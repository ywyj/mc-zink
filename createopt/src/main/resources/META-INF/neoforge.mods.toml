modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/local/createopt"

${mixins_block}

[[mods]]
modId = "createopt"
version = "${version}"
displayName = "CreateOpt (DSH)"
authors = "DSH"
description = '''
Client-side culling for Create contraption packs, zink/GL-translation friendly.
1.1.0: removed VulkanMod-only guards (stencil / ldlib2 shader / flywheel noise) that never fired on zink and could
mis-cancel real stencil requests; env detection is now diagnostic-only (GL_RENDERER). Four logic-only culling mixins:
entity distance+occlusion, block-entity distance+occlusion, particle distance, optional vanilla entity shadow off.
'''

[[dependencies.createopt]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createopt]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
